events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 동영상 업로드 허용 사이즈 (talent_media MAX_MOVIE_BYTES = 500MB 와 일치)
    client_max_body_size 600M;

    # gzip 압축 (정적 자산)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;

    upstream backend  { server backend:8000;  }
    upstream frontend { server frontend:3000; }

    server {
        listen 80 default_server;
        server_name _;

        # ─────────────────────────────────────────────────────────
        # /api/* → backend  (prefix 제거)
        # ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 미디어는 backend 가 서명 URL 로 307 redirect 하므로 nginx 를 통과하지
            # 않는다. 영상 바이트가 프록시를 거치지 않아 워커도 점유하지 않는다.
            proxy_intercept_errors off;
            proxy_buffering        off;

            # 영상 분석(analyze-stream)은 장면 수에 따라 수 분이 걸린다.
            # 기본 proxy_read_timeout 은 60초라, 그 시점에 nginx 가 연결을 끊어
            # 브라우저에는 network error 로 보인다 (백엔드는 계속 처리 중).
            # 스트리밍 응답은 청크 사이 간격도 이 타임아웃에 걸리므로 넉넉히 잡는다.
            proxy_connect_timeout  60s;
            proxy_send_timeout     600s;
            proxy_read_timeout     600s;
            # 업로드(최대 500MB)가 느린 회선에서 끊기지 않도록
            proxy_request_buffering off;
        }

        # ─────────────────────────────────────────────────────────
        # 그 외 → frontend (Next.js)
        # ─────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
