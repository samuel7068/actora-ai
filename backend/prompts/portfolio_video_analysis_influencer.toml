  },
  "resembling_celebrities": {
    "candidates": [],
    "confidence": 0.0,
    "note": ""
  },
  "mood_keywords": [],
  "search_keywords": [],
  "scene_summary": ""
}
"""

user_template = """
[장면 정보]
- scene_id: {scene_id}
- 시작: {start_sec:.2f}초 / 종료: {end_sec:.2f}초 (길이 {duration_sec:.1f}초)

[해당 구간 대사 텍스트]
{scene_text}

[음성 수치 (librosa)]
{audio_features}

위 키프레임 이미지를 보고, 함께 제공된 대사와 음성 수치를 참고해
